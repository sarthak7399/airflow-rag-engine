[project]
name = "airflow-rag-engine"
version = "0.1.0"
description = "A self-hosted, open-source RAG engine for building, evaluating, and serving retrieval-augmented generation systems over technical documentation."
readme = "README.md"
authors = [
    { name = "Sarthak Sharma" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "markdownify>=1.2.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "ragas>=0.4.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.0",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
