<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Airflow RAG Engine</title>
<style>
  :root { --bg:#f7f9fc; --card:#ffffff; --accent:#2563eb; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:860px; margin:40px auto; padding:0 20px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:12px; font-size:15px; resize:vertical; min-height:80px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .answer { white-space:pre-wrap; line-height:1.6; margin-top:16px; }
  .ctx { margin-top:16px; }
  .ctx-item { border-top:1px solid var(--border); padding:10px 0; font-size:13px; color:var(--muted); }
  .score { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Airflow RAG Engine</h1>
  <div class="sub">Ask questions about Apache Airflow documentation.</div>
  <div class="card">
    <textarea id="q" placeholder="e.g. What is a DAG?"></textarea>
    <button id="btn" onclick="ask()">Ask</button>
    <div id="answer" class="answer"></div>
    <div id="ctx" class="ctx"></div>
  </div>
</div>
<script>
async function ask(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  const btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='Thinking...';
  document.getElementById('answer').textContent='';
  document.getElementById('ctx').innerHTML='';
  try{
    const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,top_k:5})});
    const d=await r.json();
    document.getElementById('answer').textContent=d.answer;
    (d.contexts||[]).forEach((c,i)=>{
      const div=document.createElement('div');
      div.className='ctx-item';
      div.textContent=c.slice(0,300)+'...';
      document.getElementById('ctx').appendChild(div);
    });
  }catch(e){ document.getElementById('answer').textContent='Error: '+e; }
  btn.disabled=false; btn.textContent='Ask';
}
</script>
</body>
</html>
